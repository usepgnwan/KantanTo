basePath: /
definitions:
  controller.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  controller.RegisterRequest:
    properties:
      asal_sekolah:
        type: string
      email:
        type: string
      name:
        type: string
      nohp:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - nohp
    - password
    type: object
  helpers.Response:
    properties:
      data: {}
      message:
        type: string
      status:
        type: boolean
    type: object
  helpers.ResponsePaginate:
    properties:
      currentPage:
        type: integer
      from:
        type: integer
      lastPage:
        type: integer
      perPage:
        type: integer
      rows: {}
      to:
        type: integer
      total:
        type: integer
    type: object
  model.Category:
    properties:
      created_at:
        type: string
      deskripsi:
        type: string
      id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  model.Mapel:
    properties:
      created_at:
        type: string
      deskripsi:
        type: string
      id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  model.Role:
    properties:
      created_at:
        type: string
      id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  model.Setting:
    properties:
      alamat:
        type: string
      created_at:
        type: string
      deskripsi:
        type: string
      email:
        type: string
      id:
        type: integer
      nama_aplikasi:
        type: string
      no_wa:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact:
    name: Admin
  description: Dokumentasi API untuk CRUD Mapel
  title: Mapel API Documentation
  version: "1.0"
paths:
  /api/artikel:
    get:
      consumes:
      - application/json
      description: Get paginated artikel dengan filter status dan is_priority
      parameters:
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 10
        description: Limit
        in: query
        name: limit
        type: integer
      - description: Cari berdasarkan judul
        in: query
        name: search
        type: string
      - description: 'Filter status: publish / draft'
        in: query
        name: status
        type: string
      - description: Filter is_priority
        in: query
        name: priority
        type: boolean
      - default: Z9ToSwagger1413999
        description: API secret key
        in: header
        name: secret-to-apps
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.Response'
      summary: Get list artikel
      tags:
      - Artikel
    post:
      consumes:
      - multipart/form-data
      description: Supports multipart/form-data dengan thumbnail upload + kompresi
        otomatis
      parameters:
      - description: Judul
        in: formData
        name: judul
        required: true
        type: string
      - description: Konten Markdown
        in: formData
        name: konten
        required: true
        type: string
      - description: Deskripsi singkat
        in: formData
        name: deskripsi
        type: string
      - description: 'Status: publish / draft'
        in: formData
        name: status
        required: true
        type: string
      - description: Apakah headline?
        in: formData
        name: is_priority
        type: boolean
      - description: Category ID
        in: formData
        name: category_id
        type: integer
      - description: File gambar thumbnail
        in: formData
        name: thumbnail
        type: file
      - default: Z9ToSwagger1413999
        description: API secret key
        in: header
        name: secret-to-apps
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helpers.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.Response'
      summary: Create artikel baru
      tags:
      - Artikel
  /api/artikel/{id}:
