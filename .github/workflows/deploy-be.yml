name: Deploy Backend

on:
  push:
    branches: [ "main" ]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-be.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to VPS via Native SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        SSH_HOST: ${{ secrets.SERVER_HOST }}
        SSH_USER: ${{ secrets.SERVER_USERNAME }}
        ENV_BE: ${{ secrets.ENV_BE }}
      run: |
        echo "Installing SSH Client..."
        sudo apt-get update && sudo apt-get install -y openssh-client

        echo "Setting up SSH..."
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -p 22 $SSH_HOST >> ~/.ssh/known_hosts

        echo "Writing .env file directly to server..."
        echo "$ENV_BE" | ssh -o StrictHostKeyChecking=no -p 22 -i ~/.ssh/id_rsa $SSH_USER@$SSH_HOST "cat > /var/www/KantanTo/server/.env"

        echo "Connecting to server to pull and build..."
        ssh -o StrictHostKeyChecking=no -p 22 -i ~/.ssh/id_rsa $SSH_USER@$SSH_HOST 'bash -s' << 'EOF'
        set -e
        
        # Ekspor path Go jika sewaktu-waktu dibutuhkan
        export PATH=$PATH:/usr/local/go/bin
        
        cd /var/www/KantanTo
        
        echo "Mengambil kode terbaru (git pull)..."
        git pull origin main
        
        cd server
        
        echo "Melakukan kompilasi (go build)..."
        go mod download
        go build -o kantanto-be main.go
        chmod +x kantanto-be
        
        echo "Restarting backend service..."
        pkill -f "./kantanto-be" || true
        nohup ./kantanto-be > backend.log 2>&1 &
        
        echo "Backend berhasil di-restart!"
        EOF
