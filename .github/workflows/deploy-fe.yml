name: Deploy Frontend

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/deploy-fe.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: apps/frontend/package-lock.json

    - name: Install Dependencies
      working-directory: ./apps/frontend
      run: npm ci

    - name: Build Frontend
      working-directory: ./apps/frontend
      env:
        CI: false
        REACT_APP_LINK_BACKEND: ${{ secrets.REACT_APP_LINK_BACKEND }}
        REACT_APP_SECRET_BACKEND: ${{ secrets.REACT_APP_SECRET_BACKEND }}
        REACT_APP_OAUTH_CLIENT_ID: ${{ secrets.REACT_APP_OAUTH_CLIENT_ID }}
        REACT_APP_OAUTH_REDIRECT: ${{ secrets.REACT_APP_OAUTH_REDIRECT }}
        
      run: npm run build

    - name: Compress Build
      run: tar -czf build.tar.gz -C apps/frontend build

    - name: Deploy to VPS via Native SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        SSH_HOST: ${{ secrets.SERVER_HOST }}
        SSH_USER: ${{ secrets.SERVER_USERNAME }}
      run: |
        echo "Installing SSH Client..."
        sudo apt-get update && sudo apt-get install -y openssh-client

        echo "Setting up SSH..."
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -p 22 $SSH_HOST >> ~/.ssh/known_hosts

        echo "Transferring build artifact..."
        scp -o StrictHostKeyChecking=no -P 22 -i ~/.ssh/id_rsa build.tar.gz $SSH_USER@$SSH_HOST:/var/www/KantanTo/apps/frontend/

        echo "Connecting to server and deploying..."
        ssh -o StrictHostKeyChecking=no -p 22 -i ~/.ssh/id_rsa $SSH_USER@$SSH_HOST 'bash -s' << 'EOF'
        set -e
        cd /var/www/KantanTo/apps/frontend
        
        echo "Extracting files..."
        tar -xzf build.tar.gz
        rm build.tar.gz
        
        echo "Restarting service..."
        pkill -f "serve -s build" || true
        nohup npm run preview > frontend.log 2>&1 &
        
        echo "Frontend berhasil di-restart dengan npm run preview!"
        EOF
