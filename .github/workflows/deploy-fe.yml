name: Deploy Frontend

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/deploy-fe.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: apps/frontend/package-lock.json

    - name: Install Dependencies
      working-directory: ./apps/frontend
      run: npm ci

    - name: Build Frontend
      working-directory: ./apps/frontend
      env:
        CI: false
        REACT_APP_LINK_BACKEND: ${{ secrets.REACT_APP_LINK_BACKEND }}
        REACT_APP_SECRET_BACKEND: ${{ secrets.REACT_APP_SECRET_BACKEND }}
        REACT_APP_OAUTH_CLIENT_ID: ${{ secrets.REACT_APP_OAUTH_CLIENT_ID }}
        REACT_APP_OAUTH_REDIRECT: ${{ secrets.REACT_APP_OAUTH_REDIRECT }}
        
      run: npm run build

    - name: Copy Build to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "apps/frontend/build"
        target: "/var/www/KantanTo/apps/frontend"
        strip_components: 2

    - name: Restart Frontend Service
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          # Pastikan package.json tersedia di server (asumsi repo sudah di-clone di VPS)
          cd /var/www/KantanTo/apps/frontend
          
          # Matikan proses serve lama yang menggunakan build (jika ada)
          pkill -f "serve -s build" || true
          
          # Jalankan ulang frontend di background menggunakan npm run preview
          nohup npm run preview > frontend.log 2>&1 &
          
          echo "Frontend berhasil di-restart dengan npm run preview!"
