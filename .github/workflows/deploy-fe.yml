name: Deploy Frontend

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/deploy-fe.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: apps/frontend/package-lock.json

    - name: Install Dependencies
      working-directory: ./apps/frontend
      run: npm ci

    - name: Build Frontend
      working-directory: ./apps/frontend
      env:
        CI: false
      run: npm run build

    - name: Copy Build to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "apps/frontend/build"
        target: "/var/www/kantanto/frontend"
        strip_components: 2

    - name: Restart Frontend Service
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          # Pastikan folder target ada
          mkdir -p /var/www/kantanto/frontend
          cd /var/www/kantanto/frontend
          
          # Matikan proses serve lama yang menggunakan port 3000 (jika ada)
          pkill -f "serve -s build -l 3000" || true
          
          # Pastikan package serve terinstall secara global: npm install -g serve
          # Jika belum terinstall, uncomment baris di bawah ini:
          # npm install -g serve
          
          # Jalankan ulang frontend di background menggunakan nohup
          nohup serve -s build -l 3000 > frontend.log 2>&1 &
          
          echo "Frontend berhasil di-restart!"
